services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keystone-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./keystone.db
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
